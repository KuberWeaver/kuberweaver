id: local-qemu
name: Local QEMU TCG guest
version: 1.0.0
description: >-
  One QEMU TCG virtual machine booted from the administrator-pinned kernel,
  initramfs payload and BIOS. The guest proves init execution over the serial
  console; it has no network device and is not an Ansible SSH target.
category: compute
icon: server
price_monthly: 0
capability: live
engine: local-qemu
execution_provider: local-runtime-v1
executor: local-runtime-v1
admission_profile: virtual-machine
data_class: config
schema:
  type: object
  additionalProperties: false
  required: [cpu, memory_mb, disk_mb]
  properties:
    cpu:
      type: integer
      minimum: 1
      maximum: 2
      default: 1
      title: vCPUs
    memory_mb:
      type: integer
      minimum: 128
      maximum: 1024
      default: 256
      title: Memory (MiB)
    disk_mb:
      type: integer
      minimum: 64
      maximum: 512
      default: 128
      title: Scratch disk (MiB)
defaults:
  cpu: 1
  memory_mb: 256
  disk_mb: 128
resources: {cpu: 1, memory_mb: 256, disk_gb: 1}
security:
  status: local_checks
  checks: [qemu_tcg, no_network_device, digest_pinned_assets, owned_resources_only, checked_removal]
verify:
  assertions:
    - id: guest-boot-marker
      description: the guest init wrote the fixed serial boot marker
    - id: qmp-running
      description: QMP query-status reports the QEMU process running
    - id: qcow2-attached
      description: the job-private qcow2 disk matches the requested size and format
teardown:
  description: >-
    Quit the job's own QEMU process through QMP, fall back to a pidfd-verified
    termination only for the same process identity, then remove the job-private
    scratch disk and QMP socket and verify both are absent.
  removes:
    - the QEMU process, scratch qcow2 disk and QMP socket created for this job
  keeps:
    - every QEMU process and disk owned by another job
