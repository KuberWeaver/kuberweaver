id: libvirt-vm
name: Libvirt lab VM (stopped)
version: 1.0.0
description: Planned until independently applied and verified. Creates one stopped VM definition with a new blank disk, not a bootable OS.
category: compute
icon: server
price_monthly: 0
capability: planned
engine: opentofu
executor: opentofu-owned-vm-v1
schema:
  type: object
  additionalProperties: false
  properties:
    cpu:
      type: integer
      minimum: 1
      maximum: 2
      default: 1
    memory_mb:
      type: integer
      minimum: 64
      maximum: 512
      default: 128
    disk_gb:
      type: integer
      minimum: 1
      maximum: 2
      default: 1
defaults:
  cpu: 1
  memory_mb: 128
  disk_gb: 1
resources:
  cpu: 1
  memory_mb: 128
  disk_gb: 1
security:
  status: local_checks
  checks: []
iac:
  template: main.tf
