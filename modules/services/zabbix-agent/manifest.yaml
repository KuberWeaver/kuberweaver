id: zabbix-agent
name: Zabbix agent on a guest
version: 1.0.0
description: Zabbix agent brick for an existing Ubuntu guest, wrapping the pinned community.zabbix.zabbix_agent role and pointing it at the server brick on the same guest.
category: monitoring
kind: workload
capability: live
engine: ansible
executor: ansible-workload-v1
execution_provider: ansible-workload-v1
requires: compute.vm
data_class: config
implementation:
  role: community.zabbix.zabbix_agent
  version: 4.2.0
  license: GPL-3.0
  source: https://github.com/ansible-collections/community.zabbix
  reason: Maintained collection role that installs the official agent package, its configuration and its service.
schema:
  type: object
  additionalProperties: false
  required:
  - target_uuid
  - ssh_key_id
  - server_host
  - agent_hostname
  properties:
    target_uuid:
      type: string
      pattern: ^[0-9a-fA-F]{8}(-[0-9a-fA-F]{4}){3}-[0-9a-fA-F]{12}$
    ssh_key_id:
      type: string
      pattern: ^[0-9a-f]{32}$
    server_host:
      type: string
      pattern: ^[A-Za-z0-9.-]{1,253}$
    agent_hostname:
      type: string
      pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$
    listen_port:
      type: integer
      minimum: 1
      maximum: 65535
      default: 10050
    zabbix_version:
      type: string
      enum:
      - "7.0"
      - "7.2"
      - "7.4"
      default: "7.4"
defaults:
  listen_port: 10050
  zabbix_version: "7.4"
resources:
  cpu: 0.5
  memory_mb: 256
  disk_gb: 2
lifecycle:
  snapshot: snapshot.yml
  apply: apply.yml
  verify: verify.yml
  rollback: rollback.yml
  remove: remove.yml
verify:
  assertions:
  - id: service-active
    description: the zabbix-agent unit is active
  - id: port-listening
    description: the agent accepts TCP connections on the configured port
  - id: ping-answered
    description: the local agent answers its own agent.ping item with 1
  - id: server-configured
    description: the agent configuration names the configured server host
teardown:
  description: Removing the brick stops the agent and removes its package and configuration; the server and the database stay with their own bricks.
  removes:
  - the zabbix-agent package when the brick installed it
  - /etc/zabbix/zabbix_agentd.conf when the brick wrote it
  keeps:
  - the Zabbix server and the PostgreSQL database
