---
- name: Apply the zabbix-agent brick
  hosts: all
  become: true
  gather_facts: true
  roles:
    - role: community.zabbix.zabbix_agent
      vars:
        zabbix_agent_version: "{{ kw_config.zabbix_version }}"
        zabbix_agent_server: "{{ kw_config.server_host }}"
        zabbix_agent_serveractive: "{{ kw_config.server_host }}"
        zabbix_agent_hostname: "{{ kw_config.agent_hostname }}"
        zabbix_agent_listenip: 0.0.0.0
        zabbix_agent_listenport: "{{ kw_config.listen_port }}"

  tasks:
    - name: Persist the apply report
      ansible.builtin.copy:
        content: "{{ {
            'brick': 'zabbix-agent',
            'version': kw_config.zabbix_version,
            'server': kw_config.server_host,
            'hostname': kw_config.agent_hostname,
            'port': kw_config.listen_port
          } | to_nice_json }}"
        dest: "{{ kw_result_path }}"
        mode: "0600"
      delegate_to: localhost
      become: false
