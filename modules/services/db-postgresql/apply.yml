---
- name: Apply the db-postgresql brick
  hosts: all
  become: true
  gather_facts: true
  vars:
    kw_password_file: "{{ kw_config.handoff_path | dirname }}/{{ kw_config.db_user }}.password"
  pre_tasks:
    - name: Ensure the handoff directory exists
      ansible.builtin.file:
        path: "{{ kw_config.handoff_path | dirname }}"
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Inspect the existing password file
      ansible.builtin.stat:
        path: "{{ kw_password_file }}"
      register: kw_password_stat

    - name: Generate a database password on the guest
      ansible.builtin.copy:
        content: "{{ lookup('password', '/dev/null length=32 chars=ascii_letters,digits') }}"
        dest: "{{ kw_password_file }}"
        owner: root
        group: root
        mode: "0600"
      when: not kw_password_stat.stat.exists
      no_log: true

    - name: Read the database password
      ansible.builtin.slurp:
        src: "{{ kw_password_file }}"
      register: kw_password_body
      no_log: true

    - name: Set the database password fact
      ansible.builtin.set_fact:
        kw_db_password: "{{ kw_password_body.content | b64decode | trim }}"
      no_log: true

  roles:
    - role: geerlingguy.postgresql
      vars:
        postgresql_auth_method: scram-sha-256
        postgresql_global_config_options:
          - option: unix_socket_directories
            value: /var/run/postgresql
          - option: listen_addresses
            value: 127.0.0.1
          - option: port
            value: "{{ kw_config.listen_port }}"
        postgresql_hba_entries:
          - {type: local, database: all, user: postgres, auth_method: peer}
          - {type: local, database: all, user: all, auth_method: peer}
          - {type: host, database: all, user: all, address: '127.0.0.1/32', auth_method: scram-sha-256}
          - {type: host, database: all, user: all, address: '::1/128', auth_method: scram-sha-256}
        postgresql_databases:
          - name: "{{ kw_config.db_name }}"
            owner: "{{ kw_config.db_user }}"
        postgresql_users:
          - name: "{{ kw_config.db_user }}"
            password: "{{ kw_db_password }}"

  tasks:
    - name: Publish the database handoff for a dependent brick
      ansible.builtin.copy:
        content: "{{ {
            'db_name': kw_config.db_name,
            'db_user': kw_config.db_user,
            'host': '127.0.0.1',
            'port': kw_config.listen_port,
            'password_file': kw_password_file
          } | to_nice_json }}"
        dest: "{{ kw_config.handoff_path }}"
        owner: root
        group: root
        mode: "0600"
      no_log: true

    - name: Persist the apply report
      ansible.builtin.copy:
        content: "{{ {
            'brick': 'db-postgresql',
            'database': kw_config.db_name,
            'role': kw_config.db_user,
            'port': kw_config.listen_port,
            'handoff': kw_config.handoff_path
          } | to_nice_json }}"
        dest: "{{ kw_result_path }}"
        mode: "0600"
      delegate_to: localhost
      become: false
