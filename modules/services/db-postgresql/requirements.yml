---
# Pinned upstream. The brick refuses to run when the installed role does not
# match this version and checksum. The collection supplies the PostgreSQL
# modules the role calls; it is installed beside the lifecycle playbooks so the
# isolated executor finds it without a global path.
roles:
  - name: geerlingguy.postgresql
    version: "4.3.0"
collections:
  - name: community.postgresql
    version: "==5.1.2"
