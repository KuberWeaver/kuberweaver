id: db-postgresql
name: PostgreSQL on a guest
version: 1.0.0
description: PostgreSQL server brick for an existing Ubuntu guest, wrapping the upstream geerlingguy.postgresql role and publishing a local credential handoff for a dependent brick.
category: data
kind: workload
capability: live
engine: ansible
executor: ansible-workload-v1
execution_provider: ansible-workload-v1
requires: compute.vm
data_class: state
implementation:
  role: geerlingguy.postgresql
  version: 4.3.0
  license: MIT
  source: https://github.com/geerlingguy/ansible-role-postgresql
  reason: Maintained role that installs the distribution package, manages the cluster and creates databases and roles idempotently.
schema:
  type: object
  additionalProperties: false
  required:
  - target_uuid
  - ssh_key_id
  - db_name
  - db_user
  - handoff_path
  properties:
    target_uuid:
      type: string
      pattern: ^[0-9a-fA-F]{8}(-[0-9a-fA-F]{4}){3}-[0-9a-fA-F]{12}$
    ssh_key_id:
      type: string
      pattern: ^[0-9a-f]{32}$
    db_name:
      type: string
      pattern: ^[a-z][a-z0-9_]{0,62}$
    db_user:
      type: string
      pattern: ^[a-z][a-z0-9_]{0,62}$
    listen_port:
      type: integer
      minimum: 1
      maximum: 65535
      default: 5432
    handoff_path:
      type: string
      pattern: ^/[A-Za-z0-9._/-]{1,200}$
      default: /etc/kuberweaver/postgresql/handoff.json
    drop_data:
      type: boolean
      default: false
defaults:
  db_name: zabbix
  db_user: zabbix
  listen_port: 5432
  handoff_path: /etc/kuberweaver/postgresql/handoff.json
  drop_data: false
resources:
  cpu: 1
  memory_mb: 1024
  disk_gb: 10
lifecycle:
  snapshot: snapshot.yml
  apply: apply.yml
  verify: verify.yml
  rollback: rollback.yml
  remove: remove.yml
verify:
  assertions:
  - id: service-active
    description: the PostgreSQL cluster unit is active
  - id: port-listening
    description: pg_isready accepts a connection on the configured port
  - id: database-present
    description: the configured database exists
  - id: role-present
    description: the configured login role exists
teardown:
  description: Removing the brick stops the cluster and removes its package, but it never drops a database unless drop_data is true; the database holds monitoring history that this tool cannot restore.
  removes:
  - the PostgreSQL package on explicit removal
  - the generated password and handoff files
  keeps:
  - the database and its data unless drop_data is true
  - the data directory when the package existed before this brick
