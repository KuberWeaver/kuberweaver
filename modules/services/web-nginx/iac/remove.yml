---
- name: Remove the web-nginx brick
  hosts: all
  become: true
  gather_facts: false
  vars:
    kw_site_file: "/etc/nginx/sites-available/kuberweaver-{{ kw_config.server_name }}"
    kw_site_link: "/etc/nginx/sites-enabled/kuberweaver-{{ kw_config.server_name }}"
  tasks:
    - name: Remove the site configuration and its enabled link
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ kw_site_link }}"
        - "{{ kw_site_file }}"

    - name: Remove the served files
      ansible.builtin.file:
        path: "{{ kw_config.document_root }}"
        state: absent

    - name: Validate the remaining configuration
      ansible.builtin.command:
        argv: ['nginx', '-t']
      register: kw_remove_test
      changed_when: false
      failed_when: false

    - name: Reload nginx so the removed site stops being served
      ansible.builtin.service:
        name: nginx
        state: reloaded
      when: kw_remove_test.rc | default(1) == 0

    - name: Report the removal
      ansible.builtin.copy:
        content: "{{ {
            'brick': 'web-nginx',
            'removed': [kw_site_file, kw_site_link, kw_config.document_root],
            'package_kept': true,
            'config_valid': kw_remove_test.rc | default(1) == 0
          } | to_nice_json }}"
        dest: "{{ kw_result_path }}"
        mode: "0600"
      delegate_to: localhost
      become: false
