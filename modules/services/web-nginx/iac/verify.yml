---
- name: Verify the web-nginx brick
  hosts: all
  become: true
  gather_facts: false
  vars:
    kw_checks: {}
  tasks:
    - name: Read the nginx unit state
      ansible.builtin.command:
        argv: [systemctl, is-active, nginx]
      register: kw_unit
      changed_when: false
      failed_when: false

    - name: Validate the generated configuration
      ansible.builtin.command:
        argv: [/usr/sbin/nginx, -t]
      register: kw_config_test
      changed_when: false
      failed_when: false

    - name: Probe the served endpoint
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ kw_config.listen_port }}/"
        status_code: 200
        return_content: true
      register: kw_probe
      failed_when: false

    - name: Record the assertions
      ansible.builtin.set_fact:
        kw_checks:
          service-active: "{{ kw_unit.stdout | default('') | trim == 'active' }}"
          config-valid: "{{ kw_config_test.rc | default(1) == 0 }}"
          http-200: "{{ kw_probe.status | default(0) == 200 }}"
          # Header names are normalized to underscores by the uri module. The
          # assertion reads that header specifically, so a page mentioning the
          # brick name can never satisfy it.
          brick-header: "{{ (kw_probe.x_kuberweaver_brick | default((kw_probe.headers | default({})).x_kuberweaver_brick | default(''))) == 'web-nginx' }}"

    - name: Fail when an assertion is not met
      ansible.builtin.assert:
        that:
          - kw_checks['service-active'] | bool
          - kw_checks['config-valid'] | bool
          - kw_checks['http-200'] | bool
          - kw_checks['brick-header'] | bool
        fail_msg: "web-nginx verification failed: {{ kw_checks }}"
        quiet: true

    - name: Persist the verification report
      ansible.builtin.copy:
        content: "{{ {'brick': 'web-nginx', 'assertions': kw_checks, 'served': kw_probe.content | default('') | length} | to_nice_json }}"
        dest: "{{ kw_result_path }}"
        mode: "0600"
      delegate_to: localhost
      become: false
