---
- name: Snapshot the web-nginx brick target
  hosts: all
  become: true
  gather_facts: false
  vars:
    kw_site_file: "/etc/nginx/sites-available/kuberweaver-{{ kw_config.server_name }}"
    kw_site_link: "/etc/nginx/sites-enabled/kuberweaver-{{ kw_config.server_name }}"
  tasks:
    - name: Read the package state
      ansible.builtin.command:
        argv: ['dpkg-query', '-W', '-f=${Status}', 'nginx']
      register: kw_package
      changed_when: false
      failed_when: false

    - name: Read the unit state
      ansible.builtin.command:
        argv: ['systemctl', 'is-active', 'nginx']
      register: kw_unit
      changed_when: false
      failed_when: false

    - name: Inspect the site configuration and document root
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - "{{ kw_site_file }}"
        - "{{ kw_site_link }}"
        - "{{ kw_config.document_root }}"
      register: kw_paths

    - name: Read the current site configuration
      ansible.builtin.slurp:
        src: "{{ kw_site_file }}"
      register: kw_site_body
      failed_when: false

    - name: Persist the snapshot
      ansible.builtin.copy:
        content: "{{ {
            'brick': 'web-nginx',
            'package_installed': 'install ok installed' in (kw_package.stdout | default('')),
            'unit_active': (kw_unit.stdout | default('') | trim) == 'active',
            'site_file': kw_site_file,
            'site_link': kw_site_link,
            'site_existed': kw_paths.results[0].stat.exists,
            'link_existed': kw_paths.results[1].stat.exists,
            'root_existed': kw_paths.results[2].stat.exists,
            'site_content': (kw_site_body.content | default('') | b64decode)
          } | to_nice_json }}"
        dest: "{{ kw_result_path }}"
        mode: "0600"
      delegate_to: localhost
      become: false
