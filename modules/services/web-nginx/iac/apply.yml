---
- name: Apply the web-nginx brick
  hosts: all
  become: true
  gather_facts: true
  vars:
    kw_site_name: "kuberweaver-{{ kw_config.server_name }}"
    kw_root: "{{ kw_config.document_root }}"
  tasks:
    - name: Ensure the document root exists
      ansible.builtin.file:
        path: "{{ kw_root }}"
        state: directory
        owner: www-data
        group: www-data
        mode: "0755"

    - name: Publish the brick marker page when no content is supplied
      ansible.builtin.copy:
        dest: "{{ kw_root }}/index.html"
        owner: www-data
        group: www-data
        mode: "0644"
        force: false
        content: |
          <!doctype html>
          <html lang="en"><head><meta charset="utf-8"><title>{{ kw_config.server_name }}</title></head>
          <body><h1>{{ kw_config.server_name }}</h1>
          <p>Managed by KuberWeaver.</p></body></html>

  roles:
    - role: geerlingguy.nginx
      vars:
        nginx_remove_default_vhost: true
        nginx_vhosts:
          - listen: "{{ kw_config.listen_port }}"
            server_name: "{{ kw_config.server_name }}"
            filename: "{{ kw_site_name }}"
            root: "{{ kw_root }}"
            index: "index.html"
            extra_parameters: |
              add_header X-KuberWeaver-Brick "web-nginx" always;
              {% if kw_config.proxy_pass is defined %}
              location / {
                  proxy_pass {{ kw_config.proxy_pass }};
                  proxy_set_header Host $host;
                  proxy_set_header X-Forwarded-For $remote_addr;
              }
              {% endif %}
