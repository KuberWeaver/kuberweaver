id: local-oci
name: Local rootless OCI web cell
version: 1.0.0
description: >-
  One rootless OCI container on the controller, built from the administrator-pinned
  busybox asset and bound to a loopback port. No image is pulled and no graph field
  selects a binary, bundle or path.
category: web
kind: container
icon: box
price_monthly: 0
capability: live
engine: local-oci
execution_provider: local-runtime-v1
executor: local-runtime-v1
data_class: config
schema:
  type: object
  additionalProperties: false
  required: [targets, port]
  properties:
    targets:
      type: array
      items: {const: app}
      minItems: 1
      maxItems: 1
      uniqueItems: true
      default: [app]
      title: Local selector
      description: Logical local selector only. No remote host is contacted.
    port:
      type: integer
      minimum: 18090
      maximum: 18109
      default: 18090
      title: Loopback port
      description: The fixed busybox HTTP server binds 127.0.0.1 on this port.
defaults:
  targets: [app]
  port: 18090
resources: {cpu: 0.5, memory_mb: 64, disk_gb: 1}
security:
  status: local_checks
  checks: [rootless_oci, loopback_only, digest_pinned_assets, owned_resources_only, checked_removal]
verify:
  assertions:
    - id: container-running
      description: the runc state readback reports a running container owned by this job
    - id: http-200
      description: GET http://127.0.0.1:port/ returns 200 with this job's marker
    - id: loopback-only
      description: the fixed server binds 127.0.0.1 and no external interface
teardown:
  description: >-
    Stop the job's own container, delete it from the job-private runc root, and verify
    that its inventory entry, state and loopback port are absent. No other container
    is inspected or removed.
  removes:
    - the rootless container and its private bundle created for this job
  keeps:
    - every container and bundle owned by another job
