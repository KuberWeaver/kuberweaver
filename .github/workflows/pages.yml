name: Deploy showcase site

# Manual only. The repository is private and Pages is not enabled yet, so
# `actions/configure-pages` fails with "Get Pages site failed" on every push that
# touches `site/`. Enable Pages in Settings > Pages once the repository is public,
# then run this workflow by hand (Actions > Deploy showcase site > Run workflow).
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Refuse an external runtime dependency in the showcase
        run: |
          # The site must stay buildable offline. Only the project's own GitHub
          # URLs are allowed (repository link, CONTRIBUTING.md).
          if grep -rnE '(src|href)="https?://' site --include='*.html' \
             | grep -v 'github.com/EMRD95/kuberweaver'; then
            echo "the showcase site must stay offline-buildable"; exit 1
          fi
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
