name: CI

'on':
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main, 'feat/**']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Scan tracked files and history
        run: python3 ops/ci/secret_scan.py --history

  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Refuse conflict markers
        run: |
          if git grep -nE '^(<<<<<<<|>>>>>>>) ' -- . ; then
            echo "conflict markers found"; exit 1
          fi
      - name: Refuse private notes and runtime state
        run: |
          if git ls-files | grep -E '^(data/|docs/prompt/)' ; then
            echo "runtime state or private notes are tracked"; exit 1
          fi

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18.7
        env:
          POSTGRES_USER: postgres
          # Disposable local CI service credential, never a production secret.
          POSTGRES_PASSWORD: ci-admin-${{ github.run_id }}-${{ github.run_attempt }}
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Configure private per-job paths
        shell: bash
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/kuberweaver-state"
          printf '%s\n' "TMPDIR=$RUNNER_TEMP" \
            "KUBERWEAVER_STATE_DIR=$RUNNER_TEMP/kuberweaver-state" \
            "KUBERWEAVER_TEST_DATABASE_URL_FILE=$RUNNER_TEMP/postgres-test-url" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0135a47548b # v7.1.0
        with:
          python-version: '3.14'
      - name: Install pinned OpenTofu
        # Offline saved-plan tests hash this exact distribution; the archive and
        # binary digests below are pinned to the same release as TOFU_SHA256.
        shell: bash
        run: |
          set -eu
          umask 077
          curl -fsSL -o "$RUNNER_TEMP/tofu.tar.gz" \
            https://github.com/opentofu/opentofu/releases/download/v1.13.9/tofu_1.13.9_linux_amd64.tar.gz
          echo "b34b327cc1ef07178207b6f2cd1f5276537d3e5b7be316500f6dac50d4c0a857  $RUNNER_TEMP/tofu.tar.gz" | sha256sum -c -
          mkdir -p tools
          tar -xzf "$RUNNER_TEMP/tofu.tar.gz" -C tools tofu
          chmod 700 tools/tofu
          echo "9ce9173bf161f6466ef57dab7edebe8f55089fdf81caa967415323c25d004990  tools/tofu" | sha256sum -c -
      - name: Install backend and integration dependencies
        run: >-
          python -m pip install
          -r requirements.txt
          -r requirements-execution.txt
          -r requirements-mcp.txt
          -r requirements-infrastructure.txt
          -r requirements-postgresql.txt
          -r requirements-local-vault.txt
      - name: Prepare isolated local test state and PostgreSQL
        env:
          CI_POSTGRES_ADMIN_PASSWORD: ci-admin-${{ github.run_id }}-${{ github.run_attempt }}
        shell: bash
        run: |
          umask 077
          mkdir -p "$KUBERWEAVER_STATE_DIR"
          python - <<'PY'
          import os
          from pathlib import Path
          import secrets
          import psycopg
          from psycopg import sql
          from psycopg.conninfo import make_conninfo

          password = secrets.token_hex(32)
          print(f"::add-mask::{password}")
          with psycopg.connect(
              host="127.0.0.1", port=5432, dbname="postgres", user="postgres",
              password=os.environ["CI_POSTGRES_ADMIN_PASSWORD"], autocommit=True,
          ) as admin:
              admin.execute(sql.SQL(
                  "CREATE ROLE kw_test LOGIN PASSWORD {} NOSUPERUSER "
                  "NOCREATEDB NOCREATEROLE NOREPLICATION"
              ).format(sql.Literal(password)))
              admin.execute("CREATE DATABASE kw_test OWNER kw_test")
          dsn = make_conninfo(
              host="127.0.0.1", port=5432, dbname="kw_test",
              user="kw_test", password=password,
          )
          target = Path(os.environ["KUBERWEAVER_TEST_DATABASE_URL_FILE"])
          target.write_text(dsn)
          target.chmod(0o600)
          with psycopg.connect(dsn) as test:
              assert test.execute(
                  "SELECT rolsuper FROM pg_roles WHERE rolname = current_user"
              ).fetchone() == (False,)
          PY
          # Only the dedicated test DSN is exported: unrelated tests/subprocesses
          # retain SQLite defaults; PostgreSQL fixtures create UUID schemas.
      - name: Test backend and real PostgreSQL contracts
        # The optional OpenTofu registry-download check stays opt-in: no
        # unpinned external installer or VM/deployment operation in this CI.
        run: python -m pytest tests -q --tb=short
