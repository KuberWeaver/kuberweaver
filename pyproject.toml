[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kuberweaver-kw"
version = "0.1.0"
description = "kw: thin CLI client for the KuberWeaver API (one door, same roles and pins as the GUI)."
requires-python = ">=3.12"
dependencies = ["click>=8.1", "httpx>=0.27"]

[project.scripts]
kw = "kw.main:cli"

[tool.setuptools]
packages = ["kw", "kw.commands"]
