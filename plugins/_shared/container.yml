---
- name: Execute reviewed prototype container transaction
  hosts: all
  gather_facts: false
  become: true
  vars:
    kw_remote_root: /opt/kuberweaver/.executor
  tasks:
    - name: Run fixed helper and retain a private structured readback
      no_log: true
      block:
        - name: Ensure private executor directory
          ansible.builtin.file:
            path: '{{ kw_remote_root }}'
            state: directory
            mode: '0700'
        - name: Copy reviewed helper
          ansible.builtin.copy:
            src: '{{ kw_helper_path }}'
            dest: '{{ kw_remote_root }}/guest.py'
            mode: '0700'
        - name: Copy private operation request
          ansible.builtin.copy:
            content: '{{ kw_request_json }}'
            dest: '{{ kw_remote_root }}/{{ kw_token }}.json'
            mode: '0600'
        - name: Execute fixed helper without a shell
          ansible.builtin.command:
            argv:
              - /usr/bin/python3
              - '{{ kw_remote_root }}/guest.py'
              - '{{ kw_remote_root }}/{{ kw_token }}.json'
          register: kw_operation
          changed_when: kw_request.action in ['apply', 'restore']
          failed_when: false
        - name: Persist structured operation readback on controller
          ansible.builtin.copy:
            content: '{{ kw_operation.stdout }}'
            dest: '{{ kw_result_path }}'
            mode: '0600'
          delegate_to: localhost
          become: false
        - name: Check operation outcome
          ansible.builtin.assert:
            that: kw_operation.rc == 0
      always:
        - name: Remove private guest operation request
          ansible.builtin.file:
            path: '{{ kw_remote_root }}/{{ kw_token }}.json'
            state: absent
          no_log: true
