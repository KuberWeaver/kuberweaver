---
- name: Remove the zabbix-agent brick
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Stop and disable the agent
      ansible.builtin.service:
        name: zabbix-agent
        state: stopped
        enabled: false
      failed_when: false

    - name: Remove the package
      ansible.builtin.apt:
        name: zabbix-agent
        state: absent
        purge: true

    - name: Remove the agent configuration
      ansible.builtin.file:
        path: /etc/zabbix/zabbix_agentd.conf
        state: absent

    - name: Persist the removal report
      ansible.builtin.copy:
        content: "{{ {
            'brick': 'zabbix-agent',
            'package_removed': true
          } | to_nice_json }}"
        dest: "{{ kw_result_path }}"
        mode: "0600"
      delegate_to: localhost
      become: false
