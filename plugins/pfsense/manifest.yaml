id: pfsense
name: pfSense
version: 1.0.0
description: Planned pfSense configuration; deployment is disabled pending a validated adapter and authorized target.
category: security
icon: shield
price_monthly: 15
capability: planned
engine: opentofu
schema:
  type: object
  additionalProperties: false
  properties:
    targets:
      type: array
      items:
        enum:
        - app
        - branch-client
      minItems: 1
      maxItems: 2
      uniqueItems: true
      default: &id001
      - app
      - branch-client
    port:
      type: integer
      minimum: 18090
      maximum: 18109
      default: 18090
    version:
      type: string
      pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{0,31}$
      default: 1.0.0
    cpu:
      type: number
      minimum: 0.1
      maximum: 2
      default: 1
    memory_mb:
      type: integer
      minimum: 64
      maximum: 1024
      default: 256
    disk_gb:
      type: integer
      minimum: 1
      maximum: 10
      default: 2
    public_cidr:
      const: 127.0.0.1/32
      default: 127.0.0.1/32
defaults:
  targets: *id001
  port: 18090
  version: 1.0.0
  cpu: 1
  memory_mb: 256
  disk_gb: 2
  public_cidr: 127.0.0.1/32
resources:
  cpu: 1
  memory_mb: 256
  disk_gb: 2
security:
  status: local_checks
  checks: []
executor: unsupported
