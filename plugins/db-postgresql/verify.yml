---
- name: Verify the db-postgresql brick
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Read the cluster unit state
      ansible.builtin.command:
        argv: ['systemctl', 'is-active', 'postgresql']
      register: kw_unit
      changed_when: false
      failed_when: false

    - name: Probe the configured port
      ansible.builtin.command:
        argv: ['pg_isready', '-h', '127.0.0.1', '-p', "{{ kw_config.listen_port }}"]
      register: kw_ready
      changed_when: false
      failed_when: false

    - name: Check the database
      ansible.builtin.command:
        argv: ['psql', '-tAc', "SELECT 1 FROM pg_database WHERE datname='{{ kw_config.db_name }}'"]
      become_user: postgres
      register: kw_database
      changed_when: false
      failed_when: false

    - name: Check the login role
      ansible.builtin.command:
        argv: ['psql', '-tAc', "SELECT 1 FROM pg_roles WHERE rolname='{{ kw_config.db_user }}'"]
      become_user: postgres
      register: kw_role
      changed_when: false
      failed_when: false

    - name: Record the assertions
      ansible.builtin.set_fact:
        kw_checks:
          service-active: "{{ kw_unit.stdout | default('') | trim == 'active' }}"
          port-listening: "{{ kw_ready.rc | default(1) == 0 }}"
          database-present: "{{ kw_database.stdout | default('') | trim == '1' }}"
          role-present: "{{ kw_role.stdout | default('') | trim == '1' }}"

    - name: Fail when an assertion is not met
      ansible.builtin.assert:
        that:
          - kw_checks['service-active'] | bool
          - kw_checks['port-listening'] | bool
          - kw_checks['database-present'] | bool
          - kw_checks['role-present'] | bool
        fail_msg: "db-postgresql verification failed: {{ kw_checks }}"
        quiet: true

    - name: Persist the verification report
      ansible.builtin.copy:
        content: "{{ {'brick': 'db-postgresql', 'assertions': kw_checks} | to_nice_json }}"
        dest: "{{ kw_result_path }}"
        mode: "0600"
      delegate_to: localhost
      become: false
