id: web-nginx
name: NGINX on a guest
version: 1.0.0
description: HTTP server brick for an existing Ubuntu guest, wrapping the upstream geerlingguy.nginx role.
category: web
kind: workload
capability: live
engine: ansible
executor: ansible-workload-v1
requires: compute.vm
data_class: config
implementation:
  role: geerlingguy.nginx
  version: 3.3.1
  license: MIT
  source: https://github.com/geerlingguy/ansible-role-nginx
  reason: Actively maintained; the vendor collection nginxinc.nginx_core has no release in about three years.
schema:
  type: object
  additionalProperties: false
  required:
  - server_name
  properties:
    server_name:
      type: string
      pattern: ^[a-z0-9]([a-z0-9.-]{0,251})$
    listen_port:
      type: integer
      minimum: 1
      maximum: 65535
      default: 80
    document_root:
      type: string
      pattern: ^/[A-Za-z0-9._/-]{1,200}$
      default: /var/www/kuberweaver
    proxy_pass:
      type: string
      pattern: ^http://[A-Za-z0-9.-]{1,253}(:[0-9]{1,5})?$
defaults:
  listen_port: 80
  document_root: /var/www/kuberweaver
lifecycle:
  snapshot: iac/snapshot.yml
  apply: iac/apply.yml
  verify: iac/verify.yml
  rollback: iac/rollback.yml
  remove: iac/remove.yml
verify:
  assertions:
  - id: service-active
    description: the nginx unit is active
  - id: config-valid
    description: nginx -t accepts the generated configuration
  - id: http-200
    description: GET / on the configured port returns 200
  - id: brick-header
    description: the response carries X-KuberWeaver-Brick web-nginx
teardown:
  description: Remove the site configuration, disable it, and remove the served files.
  removes:
  - /etc/nginx/sites-available/kuberweaver-*
  - /etc/nginx/sites-enabled/kuberweaver-*
  keeps:
  - the nginx package, when another brick still serves through it
