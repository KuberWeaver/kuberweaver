---
- name: Roll back the web-nginx brick
  hosts: all
  become: true
  gather_facts: false
  vars:
    kw_site_file: "/etc/nginx/sites-available/kuberweaver-{{ kw_config.server_name }}"
    kw_site_link: "/etc/nginx/sites-enabled/kuberweaver-{{ kw_config.server_name }}"
  tasks:
    - name: Restore the previous site configuration
      ansible.builtin.copy:
        dest: "{{ kw_site_file }}"
        content: "{{ kw_snapshot.site_content }}"
        owner: root
        group: root
        mode: "0644"
      when: kw_snapshot.site_existed | bool

    - name: Remove a site configuration that did not exist before
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ kw_site_file }}"
        - "{{ kw_site_link }}"
      when: not (kw_snapshot.site_existed | bool)

    - name: Remove the document root created by this brick
      ansible.builtin.file:
        path: "{{ kw_config.document_root }}"
        state: absent
      when: not (kw_snapshot.root_existed | bool)

    - name: Validate the restored configuration
      ansible.builtin.command:
        argv: ['nginx', '-t']
      register: kw_restore_test
      changed_when: false
      failed_when: false
      when: kw_snapshot.unit_active | bool

    - name: Reload nginx with the restored configuration
      ansible.builtin.service:
        name: nginx
        state: reloaded
      when:
        - kw_snapshot.unit_active | bool
        - kw_restore_test.rc | default(1) == 0

    - name: Stop nginx when it was not running before this brick
      ansible.builtin.service:
        name: nginx
        state: stopped
      when: not (kw_snapshot.unit_active | bool)

    - name: Remove the package when it was not installed before this brick
      ansible.builtin.apt:
        name: nginx
        state: absent
        purge: true
      when: not (kw_snapshot.package_installed | bool)

    - name: Persist the rollback report
      ansible.builtin.copy:
        content: "{{ {
            'brick': 'web-nginx',
            'restored_site': kw_snapshot.site_existed | bool,
            'removed_root': not (kw_snapshot.root_existed | bool),
            'restored_unit': kw_snapshot.unit_active | bool,
            'removed_package': not (kw_snapshot.package_installed | bool)
          } | to_nice_json }}"
        dest: "{{ kw_result_path }}"
        mode: "0600"
      delegate_to: localhost
      become: false
