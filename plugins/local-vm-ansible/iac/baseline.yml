---
- name: KuberWeaver local VM baseline
  hosts: all
  gather_facts: true
  become: false
  tasks:
    - name: Require a guest Python 3 interpreter
      ansible.builtin.assert:
        that:
          - ansible_facts.python is defined
          - ansible_facts.python.version.major | int >= 3
        fail_msg: A guest Python 3 interpreter is required
        quiet: true

    - name: Write the managed baseline marker
      ansible.builtin.copy:
        dest: "{{ kw_marker_path }}"
        content: "{{ kw_marker_content }}\n"
        mode: "0644"
      # The marker path and content are fixed by the reviewed adapter.
