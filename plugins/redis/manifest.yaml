id: redis
name: Redis persistent lab cache
version: 1.0.0
description: Controller-only isolated-lab Redis with persistent snapshots and RESP probes. Requires the trusted redis runtime extension.
category: database
icon: database
price_monthly: 5
capability: planned
engine: ansible
executor: redis-container-v1
schema:
  type: object
  additionalProperties: false
  properties:
    targets:
      type: array
      items: {enum: [app, branch-client]}
      minItems: 1
      maxItems: 2
      uniqueItems: true
      default: [app, branch-client]
    port: {type: integer, minimum: 18090, maximum: 18109, default: 18095}
    version: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,31}$', default: '1.0.0'}
    cpu: {type: number, minimum: 0.1, maximum: 2, default: 1}
    memory_mb: {type: integer, minimum: 64, maximum: 1024, default: 256}
    disk_gb: {type: integer, minimum: 1, maximum: 10, default: 2}
    public_cidr: {const: '127.0.0.1/32', default: '127.0.0.1/32'}
    isolated_lab: {const: true, default: true}
  required: [targets, port, version, cpu, memory_mb, disk_gb, public_cidr, isolated_lab]
defaults:
  targets: [app, branch-client]
  port: 18095
  version: '1.0.0'
  cpu: 1
  memory_mb: 256
  disk_gb: 2
  public_cidr: '127.0.0.1/32'
  isolated_lab: true
resources: {cpu: 1, memory_mb: 256, disk_gb: 2}
security:
  status: local_checks
  checks: [allowlisted_targets, management_binding, controller_only_firewall, strict_schema, owned_resources_only, stopped_persistent_snapshot]
service:
  image: redis:7.4.2-alpine
  container_port: 6379
  protocol: resp2
  persistence: appendonly-always
  snapshot_limit_bytes: 16777216
iac:
  snapshot: iac/lifecycle.yml
  apply: iac/lifecycle.yml
  verify: iac/lifecycle.yml
  restore: iac/lifecycle.yml
