---
- name: Snapshot the grafana brick target
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Read the package state
      ansible.builtin.command:
        argv: ['dpkg-query', '-W', '-f=${Status}', 'grafana']
      register: kw_package
      changed_when: false
      failed_when: false

    - name: Read the unit state
      ansible.builtin.command:
        argv: ['systemctl', 'is-active', 'grafana-server']
      register: kw_unit
      changed_when: false
      failed_when: false

    - name: Inspect the configuration, the secrets, the repository and provisioning
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /etc/grafana/grafana.ini
        - /etc/kuberweaver/grafana/admin.password
        - /etc/apt/sources.list.d/grafana.sources
        - /etc/kuberweaver/grafana/kw-dashboard.password
        - /etc/grafana/provisioning/datasources/ansible.yml
        - /etc/grafana/provisioning/dashboards/ansible.yml
        - /var/lib/grafana/dashboards/kw-reporting.json
      register: kw_paths

    - name: Read the current configuration
      ansible.builtin.slurp:
        src: /etc/grafana/grafana.ini
      register: kw_config_body
      failed_when: false
      no_log: true

    - name: Persist the snapshot
      ansible.builtin.copy:
        content: "{{ {
            'brick': 'grafana',
            'package_installed': 'install ok installed' in (kw_package.stdout | default('')),
            'unit_active': (kw_unit.stdout | default('') | trim) == 'active',
            'config_existed': kw_paths.results[0].stat.exists,
            'secret_existed': kw_paths.results[1].stat.exists,
            'repo_existed': kw_paths.results[2].stat.exists,
            'reporting_secret_existed': kw_paths.results[3].stat.exists,
            'datasource_provisioning_existed': kw_paths.results[4].stat.exists,
            'dashboard_provisioning_existed': kw_paths.results[5].stat.exists,
            'reporting_dashboard_existed': kw_paths.results[6].stat.exists,
            'config_content': (kw_config_body.content | default('') | b64decode)
          } | to_nice_json }}"
        dest: "{{ kw_result_path }}"
        mode: "0600"
      delegate_to: localhost
      become: false
      no_log: true