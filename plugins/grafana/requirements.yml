---
# Pinned upstream collection and its direct dependencies. The brick refuses to
# run when the installed role does not match this version and checksum.
# Collections sit beside the lifecycle playbooks so the isolated executor finds
# them without a global path.
collections:
  - name: grafana.grafana
    version: "==6.1.0"
  - name: ansible.posix
    version: "==2.2.2"
  - name: community.general
    version: "==14.0.1"
  - name: community.grafana
    version: "==2.3.0"
  - name: community.library_inventory_filtering_v1
    version: "==1.1.5"