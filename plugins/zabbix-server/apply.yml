---
- name: Apply the zabbix-server brick
  hosts: all
  become: true
  gather_facts: true
  pre_tasks:
    - name: Read the database handoff
      ansible.builtin.slurp:
        src: "{{ kw_config.database_handoff }}"
      register: kw_handoff

    - name: Set the database facts
      ansible.builtin.set_fact:
        kw_db: "{{ kw_handoff.content | b64decode | from_json }}"
      no_log: true

    - name: Read the database password
      ansible.builtin.slurp:
        src: "{{ kw_db.password_file }}"
      register: kw_password_body
      no_log: true

    - name: Set the database password fact
      ansible.builtin.set_fact:
        kw_db_password: "{{ kw_password_body.content | b64decode | trim }}"
      no_log: true

  roles:
    - role: community.zabbix.zabbix_server
      vars:
        zabbix_server_version: "{{ kw_config.zabbix_version }}"
        zabbix_server_dbhost: "{{ kw_db.host }}"
        zabbix_server_dbport: "{{ kw_db.port }}"
        zabbix_server_dbname: "{{ kw_db.db_name }}"
        zabbix_server_dbuser: "{{ kw_db.db_user }}"
        zabbix_server_dbpassword: "{{ kw_db_password }}"
        zabbix_server_database_creation: false
        zabbix_server_database_sqlload: true
        zabbix_server_manage_service: true

  tasks:
    - name: Persist the apply report
      ansible.builtin.copy:
        content: "{{ {
            'brick': 'zabbix-server',
            'version': kw_config.zabbix_version,
            'port': kw_config.server_port,
            'database': kw_db.db_name
          } | to_nice_json }}"
        dest: "{{ kw_result_path }}"
        mode: "0600"
      delegate_to: localhost
      become: false
