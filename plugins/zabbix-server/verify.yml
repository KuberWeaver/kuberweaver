---
- name: Verify the zabbix-server brick
  hosts: all
  become: true
  gather_facts: false
  pre_tasks:
    - name: Read the database handoff
      ansible.builtin.slurp:
        src: "{{ kw_config.database_handoff }}"
      register: kw_handoff

    - name: Set the database facts
      ansible.builtin.set_fact:
        kw_db: "{{ kw_handoff.content | b64decode | from_json }}"
      no_log: true

    - name: Read the database password
      ansible.builtin.slurp:
        src: "{{ kw_db.password_file }}"
      register: kw_password_body
      no_log: true

    - name: Set the database password fact
      ansible.builtin.set_fact:
        kw_db_password: "{{ kw_password_body.content | b64decode | trim }}"
      no_log: true

  tasks:
    - name: Read the unit state
      ansible.builtin.command:
        argv: ['systemctl', 'is-active', 'zabbix-server']
      register: kw_unit
      changed_when: false
      failed_when: false

    - name: Probe the server port
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ kw_config.server_port }}"
        timeout: 5
        state: started
      register: kw_port
      failed_when: false

    - name: Read the installed version
      ansible.builtin.command:
        argv: ['/usr/sbin/zabbix_server', '-V']
      register: kw_version
      changed_when: false
      failed_when: false

    - name: Read the schema version from the database
      ansible.builtin.command:
        argv:
          - psql
          - -h
          - "{{ kw_db.host }}"
          - -p
          - "{{ kw_db.port }}"
          - -U
          - "{{ kw_db.db_user }}"
          - -d
          - "{{ kw_db.db_name }}"
          - -tAc
          - SELECT count(*) FROM dbversion
      environment:
        PGPASSWORD: "{{ kw_db_password }}"
      register: kw_schema
      changed_when: false
      failed_when: false
      no_log: true

    - name: Read the configured VMware collectors
      ansible.builtin.command:
        argv: ['grep', '-E', '^StartVMwareCollectors=', '/etc/zabbix/zabbix_server.conf']
      register: kw_vmware
      changed_when: false
      failed_when: false

    - name: Record the assertions
      ansible.builtin.set_fact:
        kw_checks:
          service-active: "{{ kw_unit.stdout | default('') | trim == 'active' }}"
          port-listening: "{{ (kw_port.state | default('')) == 'started' }}"
          version-7: "{{ 'Zabbix) 7.' in (kw_version.stdout | default('')) }}"
          database-schema: "{{ (kw_schema.stdout | default('0') | trim | int) > 0 }}"
          vmware-collectors: "{{ (kw_vmware.stdout | default('') | trim) == ('StartVMwareCollectors=' ~ kw_config.vmware_collectors) }}"

    - name: Fail when an assertion is not met
      ansible.builtin.assert:
        that:
          - kw_checks['service-active'] | bool
          - kw_checks['port-listening'] | bool
          - kw_checks['version-7'] | bool
          - kw_checks['database-schema'] | bool
          - kw_checks['vmware-collectors'] | bool
        fail_msg: "zabbix-server verification failed: {{ kw_checks }}"
        quiet: true

    - name: Persist the verification report
      ansible.builtin.copy:
        content: "{{ {'brick': 'zabbix-server', 'assertions': kw_checks} | to_nice_json }}"
        dest: "{{ kw_result_path }}"
        mode: "0600"
      delegate_to: localhost
      become: false
