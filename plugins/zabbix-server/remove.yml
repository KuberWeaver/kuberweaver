---
- name: Remove the zabbix-server brick
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Stop and disable the server
      ansible.builtin.service:
        name: zabbix-server
        state: stopped
        enabled: false
      failed_when: false

    - name: Remove the package
      ansible.builtin.apt:
        name: zabbix-server-pgsql
        state: absent
        purge: true

    - name: Remove the server configuration
      ansible.builtin.file:
        path: /etc/zabbix/zabbix_server.conf
        state: absent

    - name: Persist the removal report
      ansible.builtin.copy:
        content: "{{ {
            'brick': 'zabbix-server',
            'package_removed': true,
            'database_retained': true
          } | to_nice_json }}"
        dest: "{{ kw_result_path }}"
        mode: "0600"
      delegate_to: localhost
      become: false
