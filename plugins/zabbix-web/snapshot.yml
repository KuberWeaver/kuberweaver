---
- name: Snapshot the zabbix-web brick target
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Read the frontend package state
      ansible.builtin.command:
        argv: ['dpkg-query', '-W', '-f=${Status}', 'zabbix-frontend-php']
      register: kw_package
      changed_when: false
      failed_when: false

    - name: Read the Apache unit state
      ansible.builtin.command:
        argv: ['systemctl', 'is-active', 'apache2']
      register: kw_unit
      changed_when: false
      failed_when: false

    - name: Inspect the stock default site
      ansible.builtin.stat:
        path: /etc/apache2/sites-enabled/000-default.conf
      register: kw_default_site

    - name: Inspect the vhost and the frontend configuration
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /etc/apache2/sites-available/zabbix.conf
        - /etc/zabbix/web/zabbix.conf.php
      register: kw_paths

    - name: Read the existing vhost and frontend configuration
      ansible.builtin.slurp:
        src: "{{ item.stat.path }}"
      loop: "{{ kw_paths.results | selectattr('stat.exists') | list }}"
      register: kw_bodies
      no_log: true

    - name: Record the existing file content
      ansible.builtin.set_fact:
        kw_files: "{{ (kw_files | default({})) | combine({item.item.stat.path: (item.content | b64decode)}) }}"
      loop: "{{ kw_bodies.results | default([]) }}"
      no_log: true

    - name: Persist the snapshot
      ansible.builtin.copy:
        content: "{{ {
            'brick': 'zabbix-web',
            'package_installed': 'install ok installed' in (kw_package.stdout | default('')),
            'unit_active': (kw_unit.stdout | default('') | trim) == 'active',
            'vhost_existed': kw_paths.results[0].stat.exists,
            'config_existed': kw_paths.results[1].stat.exists,
            'default_site_enabled': kw_default_site.stat.exists,
            'files': kw_files | default({})
          } | to_nice_json }}"
        dest: "{{ kw_result_path }}"
        mode: "0600"
      delegate_to: localhost
      become: false
