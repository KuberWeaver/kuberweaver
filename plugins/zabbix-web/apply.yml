---
- name: Apply the zabbix-web brick
  hosts: all
  become: true
  gather_facts: true
  pre_tasks:
    - name: Read the database handoff
      ansible.builtin.slurp:
        src: "{{ kw_config.database_handoff }}"
      register: kw_handoff

    - name: Set the database facts
      ansible.builtin.set_fact:
        kw_db: "{{ kw_handoff.content | b64decode | from_json }}"
      no_log: true

    - name: Read the database password
      ansible.builtin.slurp:
        src: "{{ kw_db.password_file }}"
      register: kw_password_body
      no_log: true

    - name: Set the database password fact
      ansible.builtin.set_fact:
        kw_db_password: "{{ kw_password_body.content | b64decode | trim }}"
      no_log: true

  roles:
    - role: community.zabbix.zabbix_web
      vars:
        zabbix_web_version: "{{ kw_config.zabbix_version }}"
        zabbix_server_version: "{{ kw_config.zabbix_version }}"
        zabbix_web_http_server: apache
        # Debian Apache serves PHP through libapache2-mod-php (installed by the
        # role); php-fpm is absent, so its pool config must not be written.
        zabbix_web_create_php_fpm: false
        zabbix_server_hostname: "{{ kw_config.server_host }}"
        zabbix_server_listenport: "{{ kw_config.server_port }}"
        zabbix_web_vhost_port: "{{ kw_config.listen_port }}"
        zabbix_web_vhost_listen_ip: "*"
        zabbix_timezone: UTC
        zabbix_server_database: pgsql
        zabbix_server_dbhost: "{{ kw_db.host }}"
        zabbix_server_dbport: "{{ kw_db.port }}"
        zabbix_server_dbname: "{{ kw_db.db_name }}"
        zabbix_server_dbuser: "{{ kw_db.db_user }}"
        zabbix_server_dbpassword: "{{ kw_db_password }}"

  tasks:
    # The role's vhost uses RewriteEngine but never enables mod_rewrite
    # (upstream examples assume a separate apache role did it). Runs after the
    # role so apache2 is installed, before the role's restart handler flushes.
    # Plain a2enmod: apache2_module would run apache2ctl, which rejects the
    # vhost while rewrite is still missing.
    - name: Enable the Apache rewrite module used by the Zabbix vhost
      ansible.builtin.command:
        argv: ['/usr/sbin/a2enmod', 'rewrite']
      args:
        creates: /etc/apache2/mods-enabled/rewrite.load
      notify: restart apache

    # The stock 000-default vhost sorts first and answers every request whose
    # Host does not match ServerName. This guest serves only the Zabbix
    # frontend, so its vhost must be the default. Tracked by snapshot/rollback.
    - name: Disable the stock default site so the Zabbix vhost answers
      ansible.builtin.command:
        argv: ['/usr/sbin/a2dissite', '000-default']
      args:
        removes: /etc/apache2/sites-enabled/000-default.conf
      notify: restart apache

    - name: Persist the apply report
      ansible.builtin.copy:
        content: "{{ {
            'brick': 'zabbix-web',
            'version': kw_config.zabbix_version,
            'listen_port': kw_config.listen_port,
            'server': kw_config.server_host
          } | to_nice_json }}"
        dest: "{{ kw_result_path }}"
        mode: "0600"
      delegate_to: localhost
      become: false
