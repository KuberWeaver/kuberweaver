---
- name: Snapshot the cloudflare-tunnel brick target
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Read the package state
      ansible.builtin.command:
        argv: ['dpkg-query', '-W', '-f=${Status}', 'cloudflared']
      register: kw_package
      changed_when: false
      failed_when: false

    - name: Read the unit state
      ansible.builtin.command:
        argv: ['systemctl', 'is-active', 'kw-cloudflared.service']
      register: kw_unit
      changed_when: false
      failed_when: false

    - name: Inspect the env file, unit file and secret directory
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /etc/kuberweaver/cloudflared/tunnel.env
        - /etc/systemd/system/kw-cloudflared.service
        - /etc/kuberweaver/cloudflared
      register: kw_paths

    - name: Persist the snapshot
      ansible.builtin.copy:
        content: "{{ {
            'brick': 'cloudflare-tunnel',
            'package_installed': 'install ok installed' in (kw_package.stdout | default('')),
            'unit_active': (kw_unit.stdout | default('') | trim) == 'active',
            'env_existed': kw_paths.results[0].stat.exists,
            'unit_existed': kw_paths.results[1].stat.exists,
            'secret_dir_existed': kw_paths.results[2].stat.exists
          } | to_nice_json }}"
        dest: "{{ kw_result_path }}"
        mode: "0600"
      delegate_to: localhost
      become: false
