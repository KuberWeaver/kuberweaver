---
- name: Remove the cloudflare-tunnel brick
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Read the connector ownership marker
      ansible.builtin.slurp:
        src: /etc/kuberweaver/cloudflared/owner.json
      register: kw_owner

    - name: Refuse removal of a connector we do not own
      ansible.builtin.assert:
        that:
          - >-
            (kw_owner.content | b64decode | from_json) ==
            {'target': kw_config.target_uuid, 'reference': kw_config.tunnel_token_ref}

    - name: Stop and disable the connector
      ansible.builtin.service:
        name: kw-cloudflared.service
        state: stopped
        enabled: false
      failed_when: false

    - name: Remove the package
      ansible.builtin.apt:
        name: cloudflared
        state: absent
        purge: true

    - name: Remove the unit and secret files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/systemd/system/kw-cloudflared.service
        - /etc/kuberweaver/cloudflared

    - name: Reload the unit definitions
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Persist the removal report
      ansible.builtin.copy:
        content: "{{ {
            'brick': 'cloudflare-tunnel',
            'package_removed': true,
            'secret_removed': true
          } | to_nice_json }}"
        dest: "{{ kw_result_path }}"
        mode: "0600"
      delegate_to: localhost
      become: false
