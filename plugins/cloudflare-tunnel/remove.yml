---
- name: Remove the cloudflare-tunnel brick
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Stop and disable the connector
      ansible.builtin.service:
        name: kw-cloudflared.service
        state: stopped
        enabled: false
      failed_when: false

    - name: Remove the package
      ansible.builtin.apt:
        name: cloudflared
        state: absent
        purge: true
      failed_when: false

    - name: Remove the unit and secret files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/systemd/system/kw-cloudflared.service
        - /etc/kuberweaver/cloudflared

    - name: Reload the unit definitions
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Persist the removal report
      ansible.builtin.copy:
        content: "{{ {
            'brick': 'cloudflare-tunnel',
            'package_removed': true,
            'secret_removed': true
          } | to_nice_json }}"
        dest: "{{ kw_result_path }}"
        mode: "0600"
      delegate_to: localhost
      become: false
