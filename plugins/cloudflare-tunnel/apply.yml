---
- name: Apply the cloudflare-tunnel brick
  hosts: all
  become: true
  gather_facts: false
  pre_tasks:
    - name: Require the runtime credential before changing the guest
      ansible.builtin.assert:
        that:
          - kw_runtime_secret is defined
          - kw_runtime_secret is match('^[A-Za-z0-9+/=_-]{16,8192}\Z')
      no_log: true

    - name: Ensure the connector secret directory exists
      ansible.builtin.file:
        path: /etc/kuberweaver/cloudflared
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Write the connector env file
      ansible.builtin.copy:
        content: "TUNNEL_TOKEN={{ kw_runtime_secret }}\n"
        dest: /etc/kuberweaver/cloudflared/tunnel.env
        owner: root
        group: root
        mode: "0600"
      no_log: true
      diff: false

  roles:
    - role: cloudflared

  tasks:
    - name: Record the installed connector ownership
      ansible.builtin.copy:
        content: "{{ {'target': kw_config.target_uuid, 'reference': kw_config.tunnel_token_ref} | to_json }}"
        dest: /etc/kuberweaver/cloudflared/owner.json
        owner: root
        group: root
        mode: "0600"

    - name: Persist the apply report
      ansible.builtin.copy:
        content: "{{ {
            'brick': 'cloudflare-tunnel',
            'version': '1.0.0',
            'env_file': '/etc/kuberweaver/cloudflared/tunnel.env',
            'unit_file': '/etc/systemd/system/kw-cloudflared.service'
          } | to_nice_json }}"
        dest: "{{ kw_result_path }}"
        mode: "0600"
      delegate_to: localhost
      become: false
