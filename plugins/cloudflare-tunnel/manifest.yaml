id: cloudflare-tunnel
name: Cloudflare Tunnel
version: 1.1.0
description: >-
  Ansible service for running cloudflared on an existing Ubuntu guest.
  Requires a scoped vault binding and an existing remotely managed tunnel.
category: network
kind: workload
capability: live
engine: ansible
workload_secret_ref: tunnel_token_ref
executor: ansible-workload-v1
execution_provider: ansible-workload-v1
requires: compute.vm
data_class: config
implementation:
  role: cloudflared
  version: 1.0.0
  license: MIT
  source: local
  reason: >-
    Local pinned role that installs the pinned cloudflared package (sha256
    verified), writes the hardened systemd unit and starts the connector basic
    service; no third-party Galaxy role is required.
schema:
  type: object
  additionalProperties: false
  required:
  - target_uuid
  - ssh_key_id
  - tunnel_token_ref
  properties:
    target_uuid:
      type: string
      pattern: ^[0-9a-fA-F]{8}(-[0-9a-fA-F]{4}){3}-[0-9a-fA-F]{12}$
    ssh_key_id:
      type: string
      pattern: ^[0-9a-f]{32}$
    tunnel_token_ref:
      type: string
      pattern: ^cloudflare/[a-z0-9][a-z0-9_-]{0,95}\Z
defaults: {}
lifecycle:
  snapshot: snapshot.yml
  apply: apply.yml
  verify: verify.yml
  rollback: rollback.yml
  remove: remove.yml
verify:
  assertions:
  - id: service-active
    description: the kw-cloudflared unit is active
  - id: binary-present
    description: cloudflared is installed and reports its version
  - id: token-staged
    description: the tunnel env file exists, root-owned, mode 0600
  - id: unit-present
    description: the systemd unit file is present
  - id: unit-enabled
    description: the unit is enabled at boot
  - id: edge-connected
    description: the local readiness endpoint confirms a Cloudflare edge connection
teardown: >-
  Stops and disables the connector, removes the unit and the env file, and
  removes the cloudflared package. This service does not remove remote tunnels
  or DNS records.
