global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - alerts.yml
scrape_configs:
  - job_name: kuberweaver
    metrics_path: /metrics
    scrape_timeout: 5s
    static_configs:
      - targets: ['127.0.0.1:8088']
        labels:
          service: kuberweaver
          scope: local-app
