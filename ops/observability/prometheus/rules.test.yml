rule_files:
  - alerts.yml
evaluation_interval: 15s
tests:
  - name: missing target never means success
    interval: 15s
    input_series: []
    alert_rule_test:
      - eval_time: 2m
        alertname: KuberWeaverTargetMissing
        exp_alerts:
          - exp_labels: {job: kuberweaver, service: kuberweaver, severity: critical}
            exp_annotations:
              summary: KuberWeaver target or required scrape labels are missing
  - name: missing service label never means success
    interval: 15s
    input_series:
      - series: 'up{job="kuberweaver",instance="127.0.0.1:8088"}'
        values: '1+0x12'
    alert_rule_test:
      - eval_time: 2m
        alertname: KuberWeaverTargetMissing
        exp_alerts:
          - exp_labels: {job: kuberweaver, service: kuberweaver, severity: critical}
            exp_annotations:
              summary: KuberWeaver target or required scrape labels are missing
  - name: old app build does not fake operational health
    interval: 15s
    input_series:
      - series: 'up{job="kuberweaver",instance="127.0.0.1:8088",service="kuberweaver"}'
        values: '1+0x12'
    alert_rule_test:
      - eval_time: 2m
        alertname: KuberWeaverTelemetryMissing
        exp_alerts:
          - exp_labels: {job: kuberweaver, instance: '127.0.0.1:8088', service: kuberweaver, severity: warning}
            exp_annotations:
              summary: Scrape succeeded but operational telemetry is missing or app build is old
  - name: healthy labeled app has no missing telemetry alert
    interval: 15s
    input_series:
      - series: 'up{job="kuberweaver",instance="127.0.0.1:8088",service="kuberweaver"}'
        values: '1+0x12'
      - series: 'kuberweaver_operational_healthy{job="kuberweaver",instance="127.0.0.1:8088",service="kuberweaver"}'
        values: '1+0x12'
    alert_rule_test:
      - eval_time: 2m
        alertname: KuberWeaverTelemetryMissing
        exp_alerts: []
      - eval_time: 2m
        alertname: KuberWeaverTargetMissing
        exp_alerts: []
